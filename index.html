<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Will you be my Valentine?</title>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    /* FULL-SCREEN CONFETTI CANVAS */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 26px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
    }

    .art {
      width: min(260px, 80vw);
      margin: 0 auto 10px;
      display: block;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.12));
    }

    h1 {
      font-size: clamp(26px, 4vw, 44px);
      margin: 12px 0 18px;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 150px;
      margin: 0 auto;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, background .12s ease;
    }

    #yesBtn {
      left: 18%;
      background: var(--yes);
      color: #fff;
    }
    #yesBtn:hover { background: var(--yesHover); }

    #noBtn {
      left: 62%;
      background: #e5e7eb;
      color: #111827;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }

    .result {
      display: none;
      margin-top: 18px;
      animation: pop .35s ease;
    }

    .result h2 {
      font-size: clamp(30px, 4.5vw, 46px);
      margin: 10px 0;
    }

    .fireworks {
      width: min(380px, 90vw);
      margin: 0 auto;
      display: block;
    }

    @keyframes pop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <!-- ANIMAL WITH HEART -->
    <svg class="art" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#87ceeb"/>
          <stop offset="1" stop-color="#b4e1ff"/>
        </linearGradient>
      </defs>
      
      <!-- Sky Background -->
      <rect width="320" height="240" fill="url(#sky)"/>
      
      <!-- Grass -->
      <rect x="0" y="180" width="320" height="60" fill="#7cb342"/>
      <rect x="0" y="190" width="320" height="50" fill="#66a03a"/>
      
      <!-- Pixel-style grass tufts -->
      <rect x="20" y="185" width="10" height="8" fill="#8bc34a"/>
      <rect x="50" y="188" width="10" height="8" fill="#8bc34a"/>
      <rect x="90" y="186" width="10" height="8" fill="#8bc34a"/>
      <rect x="140" y="187" width="10" height="8" fill="#8bc34a"/>
      <rect x="200" y="185" width="10" height="8" fill="#8bc34a"/>
      <rect x="260" y="188" width="10" height="8" fill="#8bc34a"/>
      
      <!-- Large Stardew Valley style heart (pixelated) -->
      <g transform="translate(160, 100)">
        <!-- Heart in pixel art style -->
        <rect x="-40" y="-20" width="20" height="20" fill="#ff4d7d"/>
        <rect x="20" y="-20" width="20" height="20" fill="#ff4d7d"/>
        <rect x="-60" y="0" width="20" height="20" fill="#ff1f68"/>
        <rect x="-40" y="0" width="20" height="20" fill="#ff4d7d"/>
        <rect x="-20" y="0" width="20" height="20" fill="#ff6b9d"/>
        <rect x="0" y="0" width="20" height="20" fill="#ff6b9d"/>
        <rect x="20" y="0" width="20" height="20" fill="#ff4d7d"/>
        <rect x="40" y="0" width="20" height="20" fill="#ff1f68"/>
        <rect x="-60" y="20" width="20" height="20" fill="#ff1f68"/>
        <rect x="-40" y="20" width="20" height="20" fill="#ff4d7d"/>
        <rect x="-20" y="20" width="20" height="20" fill="#ff6b9d"/>
        <rect x="0" y="20" width="20" height="20" fill="#ff6b9d"/>
        <rect x="20" y="20" width="20" height="20" fill="#ff4d7d"/>
        <rect x="40" y="20" width="20" height="20" fill="#ff1f68"/>
        <rect x="-40" y="40" width="20" height="20" fill="#ff1f68"/>
        <rect x="-20" y="40" width="20" height="20" fill="#ff4d7d"/>
        <rect x="0" y="40" width="20" height="20" fill="#ff4d7d"/>
        <rect x="20" y="40" width="20" height="20" fill="#ff1f68"/>
        <rect x="-20" y="60" width="20" height="20" fill="#ff1f68"/>
        <rect x="0" y="60" width="20" height="20" fill="#ff1f68"/>
      </g>
      
      <!-- Sparkles around heart -->
      <circle cx="100" cy="80" r="3" fill="#fff9c4"/>
      <circle cx="220" cy="90" r="3" fill="#fff9c4"/>
      <circle cx="130" cy="60" r="2" fill="#fffde7"/>
      <circle cx="190" cy="65" r="2" fill="#fffde7"/>
      
      <!-- Small flowers -->
      <circle cx="40" cy="200" r="5" fill="#ff9800"/>
      <circle cx="280" cy="205" r="5" fill="#ff9800"/>
      <circle cx="110" cy="210" r="5" fill="#e91e63"/>
      <circle cx="240" cy="208" r="5" fill="#e91e63"/>
    </svg>

    <h1>Itzel mi amor, mi cielo y mis estrellas... ¿Quieres ser mi valentín?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">SII 💖</button>
      <button id="noBtn">Nop 😭</button>
    </section>

    <!-- HINT -->
    <div class="hint" id="hint">“No” parece un poco tímido 😈</div>

    <section class="result" id="result">
      <h2>SIIIIIIIIII! 🎉</h2>
      <img
        class="fireworks"
        src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ2l0MHhtMmpydmF5bXdnaXd4dHU1c3Zlbms4aWFzNHBmOXg1MGFjbCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/URExNvlgfjZ2rd5Gl0/giphy.gif"
        alt="Fireworks"
      />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");

    /* ---------- CONFETTI ---------- */
    const confettiCanvas = document.getElementById("confettiCanvas");

    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }

    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 150));

    const confettiInstance = confetti.create(confettiCanvas, {
      resize: false,
      useWorker: true
    });

    function fullScreenConfetti() {
      const end = Date.now() + 1600;

      (function frame() {
        confettiInstance({
          particleCount: 12,
          spread: 90,
          startVelocity: 45,
          ticks: 180,
          origin: { x: Math.random(), y: Math.random() * 0.3 }
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 300,
          spread: 140,
          startVelocity: 60,
          ticks: 220,
          origin: { x: 0.5, y: 0.55 }
        });
      }, 300);
    }

    /* ---------- YES BUTTON GROWS ---------- */
    let yesScale = 1;
    function growYes() {
      yesScale = Math.min(2.2, yesScale + 0.1);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    /* ---------- NO BUTTON RUNS AWAY ---------- */
    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function moveNo(px, py) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      let dx = (b.left + b.width / 2) - px;
      let dy = (b.top + b.height / 2) - py;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag;
      dy /= mag;

      let newLeft = (b.left - z.left) + dx * 150;
      let newTop  = (b.top - z.top) + dy * 150;

      newLeft = clamp(newLeft, 0, z.width - b.width);
      newTop  = clamp(newTop, 0, z.height - b.height);

      noBtn.style.left = newLeft + "px";
      noBtn.style.top = newTop + "px";
      noBtn.style.transform = "none";

      growYes();
    }

    zone.addEventListener("pointermove", e => {
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot(
        (b.left + b.width / 2) - e.clientX,
        (b.top + b.height / 2) - e.clientY
      );
      if (d < 140) moveNo(e.clientX, e.clientY);
    });

    noBtn.addEventListener("click", e => e.preventDefault());

    /* ---------- YES CLICK ---------- */
    yesBtn.addEventListener("click", () => {
      zone.style.display = "none";
      hint.style.display = "none";     // HIDE THE HINT
      result.style.display = "block";
      resizeConfettiCanvas();
      fullScreenConfetti();
    });
  </script>
</body>
</html>
